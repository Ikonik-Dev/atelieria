<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>La propagation d'erreur</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/>
    </marker>
    <path id="coche" d="M-16,0 l11,12 l22,-24" fill="none" stroke="#0b4a8f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b" text-anchor="middle">
    <!-- Accolade au-dessus des étapes 4 à 6 -->
    <path d="M620,128 v-18 h530 v18" fill="none" stroke="#b34d00" stroke-width="5"/>
    <text x="885" y="92" font-size="27" font-weight="700" fill="#8a3b00">l'erreur est traitée comme un fait</text>

    <!-- Étapes 1 et 2 : tout va bien -->
    <rect x="30" y="150" width="150" height="120" rx="14" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="105" y="205" font-size="46" font-weight="700">1</text>
    <use href="#coche" x="105" y="240"/>
    <line x1="184" y1="210" x2="218" y2="210" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>

    <rect x="225" y="150" width="150" height="120" rx="14" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="300" y="205" font-size="46" font-weight="700">2</text>
    <use href="#coche" x="300" y="240"/>
    <line x1="379" y1="210" x2="413" y2="210" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>

    <!-- Étape 3 : petite erreur -->
    <rect x="420" y="150" width="150" height="120" rx="14" fill="#ffe3c7" stroke="#b34d00" stroke-width="5"/>
    <text x="470" y="205" font-size="46" font-weight="700">3</text>
    <circle cx="525" cy="196" r="24" fill="#b34d00"/>
    <text x="525" y="207" font-size="32" font-weight="700" fill="#ffffff">!</text>
    <text x="495" y="312" font-size="27" font-weight="700" fill="#8a3b00">petite erreur</text>
    <line x1="574" y1="210" x2="608" y2="210" stroke="#4d4d4d" stroke-width="9" marker-end="url(#fleche)"/>

    <!-- Étapes 4 à 6 : l'erreur grossit -->
    <rect x="615" y="150" width="150" height="120" rx="14" fill="#ffd2a8" stroke="#b34d00" stroke-width="6"/>
    <text x="690" y="224" font-size="46" font-weight="700">4</text>
    <line x1="769" y1="210" x2="803" y2="210" stroke="#4d4d4d" stroke-width="12" marker-end="url(#fleche)"/>

    <rect x="810" y="150" width="150" height="120" rx="14" fill="#ffbd85" stroke="#b34d00" stroke-width="8"/>
    <text x="885" y="224" font-size="46" font-weight="700">5</text>
    <line x1="964" y1="210" x2="998" y2="210" stroke="#4d4d4d" stroke-width="15" marker-end="url(#fleche)"/>

    <rect x="1005" y="150" width="150" height="120" rx="14" fill="#ffa35c" stroke="#b34d00" stroke-width="10"/>
    <text x="1080" y="224" font-size="46" font-weight="700">6</text>

    <!-- Vers le résultat -->
    <path d="M1080,276 Q1080,470 925,470" fill="none" stroke="#4d4d4d" stroke-width="16" marker-end="url(#fleche)"/>

    <!-- Résultat -->
    <rect x="270" y="400" width="640" height="140" rx="16" fill="#ffffff" stroke="#b34d00" stroke-width="12"/>
    <text x="590" y="461" font-size="34" font-weight="700">Résultat faux,</text>
    <text x="590" y="505" font-size="34" font-weight="700">mais présenté avec assurance.</text>
  </g>
</svg>
