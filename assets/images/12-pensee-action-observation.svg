<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Pensée, action, observation</title>
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b" text-anchor="middle">
    <!-- En-têtes -->
    <rect x="250" y="30" width="300" height="58" rx="10" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="400" y="69" font-size="30" font-weight="700">Pensée</text>
    <rect x="560" y="30" width="300" height="58" rx="10" fill="#ffe3c7" stroke="#b34d00" stroke-width="5"/>
    <text x="710" y="69" font-size="30" font-weight="700">Action</text>
    <rect x="870" y="30" width="300" height="58" rx="10" fill="#ececec" stroke="#4d4d4d" stroke-width="5"/>
    <text x="1020" y="69" font-size="30" font-weight="700">Observation</text>

    <!-- Ligne 1 -->
    <rect x="250" y="100" width="300" height="100" rx="8" fill="#ffffff" stroke="#0b4a8f" stroke-width="3"/>
    <text x="400" y="142" font-size="22">Je cherche une salle</text>
    <text x="400" y="172" font-size="22">libre mardi.</text>
    <rect x="560" y="100" width="300" height="100" rx="8" fill="#ffffff" stroke="#b34d00" stroke-width="3"/>
    <text x="710" y="142" font-size="22">Consulter</text>
    <text x="710" y="172" font-size="22">le planning.</text>
    <rect x="870" y="100" width="300" height="100" rx="8" fill="#ffffff" stroke="#4d4d4d" stroke-width="3"/>
    <text x="1020" y="142" font-size="22">Salle B libre</text>
    <text x="1020" y="172" font-size="22">mardi 14, à 10 h.</text>

    <!-- Ligne 2 (celle où ça dérape) -->
    <rect x="250" y="215" width="300" height="100" rx="8" fill="#ffffff" stroke="#0b4a8f" stroke-width="3"/>
    <text x="400" y="257" font-size="22">Je réserve la salle B</text>
    <text x="400" y="287" font-size="22">mardi 14.</text>
    <rect x="560" y="215" width="300" height="100" rx="8" fill="#ffffff" stroke="#b34d00" stroke-width="3"/>
    <text x="710" y="257" font-size="22">Réserver la salle B</text>
    <text x="710" y="287" font-size="22">mercredi 15.</text>
    <rect x="870" y="215" width="300" height="100" rx="8" fill="#ffffff" stroke="#4d4d4d" stroke-width="3"/>
    <text x="1020" y="257" font-size="22">Réservé :</text>
    <text x="1020" y="287" font-size="22">mercredi 15, 10 h.</text>

    <!-- Ligne 3 -->
    <rect x="250" y="330" width="300" height="100" rx="8" fill="#ffffff" stroke="#0b4a8f" stroke-width="3"/>
    <text x="400" y="387" font-size="22">C'est fait.</text>
    <rect x="560" y="330" width="300" height="100" rx="8" fill="#ffffff" stroke="#b34d00" stroke-width="3"/>
    <text x="710" y="372" font-size="22">Envoyer</text>
    <text x="710" y="402" font-size="22">l'invitation.</text>
    <rect x="870" y="330" width="300" height="100" rx="8" fill="#ffffff" stroke="#4d4d4d" stroke-width="3"/>
    <text x="1020" y="372" font-size="22">Invitation</text>
    <text x="1020" y="402" font-size="22">envoyée.</text>

    <!-- Loupe sur la ligne 2 -->
    <rect x="241" y="206" width="628" height="118" rx="12" fill="none" stroke="#b34d00" stroke-width="7" stroke-dasharray="20 10"/>
    <line x1="170" y1="265" x2="239" y2="265" stroke="#b34d00" stroke-width="6"/>
    <circle cx="115" cy="250" r="46" fill="#ffffff" stroke="#4d4d4d" stroke-width="9"/>
    <line x1="82" y1="284" x2="48" y2="320" stroke="#4d4d4d" stroke-width="14" stroke-linecap="round"/>
    <text x="120" y="370" font-size="22" font-weight="700">C'est ici que</text>
    <text x="120" y="398" font-size="22" font-weight="700">je peux voir</text>
    <text x="120" y="426" font-size="22" font-weight="700">où ça dérape.</text>

    <!-- Bandeau -->
    <rect x="80" y="540" width="1040" height="74" rx="12" fill="#ffe3c7" stroke="#b34d00" stroke-width="4"/>
    <text x="600" y="588" font-size="29" font-weight="700">Quand je vois les étapes, je peux trouver où est l'erreur.</text>
  </g>
</svg>
