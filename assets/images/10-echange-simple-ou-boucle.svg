<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Échange simple ou boucle agentique</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/>
    </marker>
    <!-- Personne : tête + buste -->
    <g id="personne" fill="#0b4a8f">
      <circle cx="0" cy="-16" r="13"/>
      <path d="M-21,26 v-10 a21,21 0 0 1 42,0 v10 z"/>
    </g>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b" text-anchor="middle">
    <!-- Colonne de gauche -->
    <text x="300" y="62" font-size="34" font-weight="700">Échange simple</text>
    <rect x="150" y="100" width="300" height="80" rx="12" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="300" y="150" font-size="28" font-weight="700">Je demande</text>
    <use href="#personne" x="100" y="138"/>
    <line x1="300" y1="182" x2="300" y2="222" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="150" y="232" width="300" height="80" rx="12" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="300" y="282" font-size="28" font-weight="700">Il répond</text>
    <use href="#personne" x="100" y="270"/>
    <line x1="300" y1="314" x2="300" y2="354" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="150" y="364" width="300" height="80" rx="12" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="300" y="414" font-size="28" font-weight="700">Je décide</text>
    <use href="#personne" x="100" y="402"/>

    <!-- Séparation -->
    <line x1="600" y1="30" x2="600" y2="520" stroke="#9a9a9a" stroke-width="4"/>

    <!-- Colonne de droite : 6 étapes sans personne -->
    <text x="900" y="62" font-size="34" font-weight="700">Boucle agentique</text>
    <rect x="630" y="100" width="160" height="70" rx="12" fill="#ececec" stroke="#4d4d4d" stroke-width="4"/>
    <text x="710" y="144" font-size="25" font-weight="700">Étape 1</text>
    <line x1="792" y1="135" x2="814" y2="135" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="820" y="100" width="160" height="70" rx="12" fill="#ececec" stroke="#4d4d4d" stroke-width="4"/>
    <text x="900" y="144" font-size="25" font-weight="700">Étape 2</text>
    <line x1="982" y1="135" x2="1004" y2="135" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="1010" y="100" width="160" height="70" rx="12" fill="#ececec" stroke="#4d4d4d" stroke-width="4"/>
    <text x="1090" y="144" font-size="25" font-weight="700">Étape 3</text>
    <line x1="1090" y1="172" x2="1090" y2="214" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="1010" y="224" width="160" height="70" rx="12" fill="#ececec" stroke="#4d4d4d" stroke-width="4"/>
    <text x="1090" y="268" font-size="25" font-weight="700">Étape 4</text>
    <line x1="1008" y1="259" x2="986" y2="259" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="820" y="224" width="160" height="70" rx="12" fill="#ececec" stroke="#4d4d4d" stroke-width="4"/>
    <text x="900" y="268" font-size="25" font-weight="700">Étape 5</text>
    <line x1="818" y1="259" x2="796" y2="259" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="630" y="224" width="160" height="70" rx="12" fill="#ececec" stroke="#4d4d4d" stroke-width="4"/>
    <text x="710" y="268" font-size="25" font-weight="700">Étape 6</text>
    <line x1="710" y1="296" x2="710" y2="354" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="690" y="364" width="440" height="80" rx="12" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="910" y="414" font-size="28" font-weight="700">Je découvre le résultat</text>
    <use href="#personne" x="650" y="402"/>

    <!-- Bandeau -->
    <rect x="60" y="560" width="1080" height="74" rx="12" fill="#ffe3c7" stroke="#b34d00" stroke-width="4"/>
    <text x="600" y="609" font-size="32" font-weight="700">Plus il fait d'étapes seul, plus je dois vérifier.</text>
  </g>
</svg>
