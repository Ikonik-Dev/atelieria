<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Du prompt au contexte</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b">
    <!-- Panneau de gauche : avant -->
    <text x="300" y="72" font-size="34" font-weight="700" text-anchor="middle">Avant :</text>
    <text x="300" y="114" font-size="30" text-anchor="middle">je soigne ma phrase</text>
    <path d="M80,230 h210 a20,20 0 0 1 20,20 v70 a20,20 0 0 1 -20,20 h-150 l-34,36 l6,-36 h-32 a20,20 0 0 1 -20,-20 v-70 a20,20 0 0 1 20,-20 z" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5"/>
    <text x="185" y="296" font-size="30" font-weight="700" text-anchor="middle">Ma demande</text>
    <line x1="318" y1="285" x2="360" y2="285" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <rect x="372" y="210" width="196" height="150" rx="14" fill="#ececec" stroke="#4d4d4d" stroke-width="5"/>
    <text x="470" y="296" font-size="30" font-weight="700" text-anchor="middle">Le modèle</text>

    <!-- Séparation -->
    <line x1="600" y1="40" x2="600" y2="545" stroke="#9a9a9a" stroke-width="4"/>

    <!-- Panneau de droite : maintenant -->
    <text x="900" y="72" font-size="34" font-weight="700" text-anchor="middle">Maintenant :</text>
    <text x="900" y="114" font-size="28" text-anchor="middle">je choisis ce qu'il a sous les yeux</text>

    <rect x="620" y="150" width="310" height="62" rx="10" fill="#dce9f8" stroke="#0b4a8f" stroke-width="4"/>
    <text x="775" y="190" font-size="24" font-weight="700" text-anchor="middle">Ma demande</text>
    <rect x="620" y="226" width="310" height="62" rx="10" fill="#dce9f8" stroke="#0b4a8f" stroke-width="4"/>
    <text x="775" y="266" font-size="24" font-weight="700" text-anchor="middle">Mes documents</text>
    <rect x="620" y="302" width="310" height="62" rx="10" fill="#dce9f8" stroke="#0b4a8f" stroke-width="4"/>
    <text x="775" y="342" font-size="24" font-weight="700" text-anchor="middle">Les messages d'avant</text>
    <rect x="620" y="378" width="310" height="62" rx="10" fill="#dce9f8" stroke="#0b4a8f" stroke-width="4"/>
    <text x="775" y="418" font-size="24" font-weight="700" text-anchor="middle">Les règles à respecter</text>

    <line x1="936" y1="181" x2="984" y2="248" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <line x1="936" y1="257" x2="984" y2="276" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <line x1="936" y1="333" x2="984" y2="312" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>
    <line x1="936" y1="409" x2="984" y2="340" stroke="#4d4d4d" stroke-width="6" marker-end="url(#fleche)"/>

    <rect x="995" y="215" width="175" height="150" rx="14" fill="#ececec" stroke="#4d4d4d" stroke-width="5"/>
    <text x="1082" y="301" font-size="30" font-weight="700" text-anchor="middle">Le modèle</text>

    <!-- Ce que je retire exprès : pointillés + croix -->
    <rect x="620" y="468" width="310" height="62" rx="10" fill="#ffffff" stroke="#4d4d4d" stroke-width="4" stroke-dasharray="14 9"/>
    <text x="775" y="507" font-size="22" font-weight="700" text-anchor="middle" fill="#4d4d4d">Ce que je retire exprès</text>
    <circle cx="985" cy="499" r="28" fill="#ffffff" stroke="#b34d00" stroke-width="6"/>
    <line x1="970" y1="484" x2="1000" y2="514" stroke="#b34d00" stroke-width="7" stroke-linecap="round"/>
    <line x1="1000" y1="484" x2="970" y2="514" stroke="#b34d00" stroke-width="7" stroke-linecap="round"/>

    <!-- Bandeau -->
    <rect x="40" y="575" width="1120" height="74" rx="12" fill="#ffe3c7" stroke="#b34d00" stroke-width="4"/>
    <text x="600" y="624" font-size="32" font-weight="700" text-anchor="middle">Le contexte compte, pas seulement la phrase.</text>
  </g>
</svg>
