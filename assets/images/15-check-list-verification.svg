<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Check-list de vérification d'un résultat agentique</title>
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b">
    <!-- Lignes de séparation -->
    <g stroke="#cfcfcf" stroke-width="3">
      <line x1="90" y1="150" x2="1110" y2="150"/>
      <line x1="90" y1="270" x2="1110" y2="270"/>
      <line x1="90" y1="390" x2="1110" y2="390"/>
      <line x1="90" y1="510" x2="1110" y2="510"/>
    </g>

    <!-- 1. D'où vient cette information ? : document -->
    <rect x="100" y="68" width="48" height="48" rx="6" fill="#ffffff" stroke="#4d4d4d" stroke-width="5"/>
    <path d="M218,62 h36 l18,18 v44 h-54 z" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M254,62 v18 h18" fill="none" stroke="#0b4a8f" stroke-width="5"/>
    <line x1="228" y1="96" x2="260" y2="96" stroke="#0b4a8f" stroke-width="4"/>
    <line x1="228" y1="110" x2="260" y2="110" stroke="#0b4a8f" stroke-width="4"/>
    <text x="320" y="104" font-size="33">D'où vient cette information ?</text>

    <!-- 2. Quelles étapes ont été faites ? : escalier d'étapes -->
    <rect x="100" y="188" width="48" height="48" rx="6" fill="#ffffff" stroke="#4d4d4d" stroke-width="5"/>
    <path d="M212,240 v-16 h20 v-16 h20 v-16 h20 v48 z" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5" stroke-linejoin="round"/>
    <text x="320" y="224" font-size="33">Quelles étapes ont été faites ?</text>

    <!-- 3. Action irréversible ? : triangle d'attention -->
    <rect x="100" y="308" width="48" height="48" rx="6" fill="#ffffff" stroke="#4d4d4d" stroke-width="5"/>
    <path d="M242,300 l32,58 h-64 z" fill="#ffe3c7" stroke="#b34d00" stroke-width="5" stroke-linejoin="round"/>
    <line x1="242" y1="320" x2="242" y2="338" stroke="#b34d00" stroke-width="6" stroke-linecap="round"/>
    <circle cx="242" cy="349" r="3.5" fill="#b34d00"/>
    <text x="320" y="344" font-size="33">Y a-t-il une action irréversible ?</text>

    <!-- 4. Chiffres et dates vérifiés ? : calendrier -->
    <rect x="100" y="428" width="48" height="48" rx="6" fill="#ffffff" stroke="#4d4d4d" stroke-width="5"/>
    <rect x="214" y="424" width="56" height="54" rx="6" fill="#ffffff" stroke="#0b4a8f" stroke-width="5"/>
    <rect x="214" y="424" width="56" height="15" rx="4" fill="#0b4a8f"/>
    <text x="242" y="471" font-size="24" font-weight="700" text-anchor="middle" fill="#0b4a8f">14</text>
    <text x="320" y="464" font-size="33">Les chiffres et les dates sont-ils vérifiés ?</text>

    <!-- 5. Pourrais-je l'expliquer ? : bulle de parole -->
    <rect x="100" y="548" width="48" height="48" rx="6" fill="#ffffff" stroke="#4d4d4d" stroke-width="5"/>
    <path d="M216,548 h52 a8,8 0 0 1 8,8 v28 a8,8 0 0 1 -8,8 h-30 l-14,14 v-14 h-8 a8,8 0 0 1 -8,-8 v-28 a8,8 0 0 1 8,-8 z" fill="#dce9f8" stroke="#0b4a8f" stroke-width="5" stroke-linejoin="round"/>
    <text x="320" y="584" font-size="33">Est-ce que je pourrais l'expliquer à quelqu'un ?</text>
  </g>
</svg>
