<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Les permissions de l'agent</title>
  <defs>
    <!-- Coche (action autorisée) -->
    <path id="coche" d="M-13,0 l9,10 l18,-20" fill="none" stroke="#0b4a8f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Croix (action interdite) -->
    <g id="croix" stroke="#b34d00" stroke-width="7" stroke-linecap="round">
      <line x1="-11" y1="-11" x2="11" y2="11"/>
      <line x1="11" y1="-11" x2="-11" y2="11"/>
    </g>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b" font-weight="700">
    <!-- Périmètre -->
    <circle cx="600" cy="290" r="240" fill="none" stroke="#0b4a8f" stroke-width="6" stroke-dasharray="24 14"/>
    <circle cx="600" cy="290" r="82" fill="#dce9f8" stroke="#0b4a8f" stroke-width="6"/>
    <text x="600" y="301" font-size="32" text-anchor="middle">L'agent</text>

    <!-- Actions autorisées, dans le périmètre -->
    <rect x="510" y="112" width="180" height="58" rx="10" fill="#ffffff" stroke="#0b4a8f" stroke-width="4"/>
    <use href="#coche" x="538" y="141"/>
    <text x="562" y="150" font-size="26">Chercher</text>
    <rect x="425" y="380" width="150" height="56" rx="10" fill="#ffffff" stroke="#0b4a8f" stroke-width="4"/>
    <use href="#coche" x="453" y="408"/>
    <text x="480" y="417" font-size="26">Lire</text>
    <rect x="605" y="380" width="180" height="56" rx="10" fill="#ffffff" stroke="#0b4a8f" stroke-width="4"/>
    <use href="#coche" x="631" y="408"/>
    <text x="655" y="417" font-size="26">Proposer</text>

    <!-- Actions interdites, hors du périmètre -->
    <rect x="70" y="150" width="220" height="62" rx="10" fill="#ffffff" stroke="#4d4d4d" stroke-width="4" stroke-dasharray="12 8"/>
    <use href="#croix" x="104" y="181"/>
    <text x="134" y="190" font-size="26" fill="#4d4d4d">Envoyer</text>

    <rect x="70" y="370" width="220" height="62" rx="10" fill="#ffffff" stroke="#4d4d4d" stroke-width="4" stroke-dasharray="12 8"/>
    <use href="#croix" x="104" y="401"/>
    <text x="134" y="410" font-size="26" fill="#4d4d4d">Payer</text>

    <rect x="900" y="259" width="240" height="62" rx="10" fill="#ffffff" stroke="#4d4d4d" stroke-width="4" stroke-dasharray="12 8"/>
    <use href="#croix" x="934" y="290"/>
    <text x="964" y="299" font-size="26" fill="#4d4d4d">Supprimer</text>

    <!-- Légende -->
    <rect x="160" y="570" width="880" height="72" rx="12" fill="#ececec" stroke="#4d4d4d" stroke-width="4"/>
    <text x="600" y="618" font-size="30" text-anchor="middle">C'est un humain qui décide du périmètre.</text>
  </g>
</svg>
